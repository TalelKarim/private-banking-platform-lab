---
- name: Register the demo-3tier deployment job on Jenkins controller
  hosts: jenkins_controllers
  gather_facts: false
  become: true

  pre_tasks:
    - name: Read the Jenkins administrator password from SSM on ops-runner
      ansible.builtin.command:
        argv:
          - /usr/local/bin/aws
          - ssm
          - get-parameter
          - --region
          - "{{ jenkins_admin_password_aws_region }}"
          - --name
          - "{{ jenkins_admin_password_ssm_parameter_name }}"
          - --with-decryption
          - --query
          - Parameter.Value
          - --output
          - text
      delegate_to: localhost
      become: false
      register: jenkins_demo_admin_password_lookup
      changed_when: false
      no_log: true

    - name: Hold Jenkins administrator password only in Ansible memory
      ansible.builtin.set_fact:
        jenkins_demo_admin_password: "{{ jenkins_demo_admin_password_lookup.stdout }}"
      no_log: true

  roles:
    - role: jenkins_demo_controller
      vars:
        jenkins_demo_admin_username: "{{ jenkins_admin_username }}"
        jenkins_demo_pipeline_definition: >-
          {{ lookup('ansible.builtin.file', playbook_dir + '/../../../applications/demo-3tier/Jenkinsfile') }}
