---
openstack_runtime_project_name: admin
openstack_runtime_quota_instances: 100
openstack_runtime_quota_cores: 200
# OpenStack expects MiB; 500 GiB = 500 * 1024 MiB.
openstack_runtime_quota_ram_mb: 512000

openstack_runtime_client: /opt/openstack-client-venv/bin/openstack
openstack_runtime_clouds_file: /data/openstack/secrets/clouds.yaml
openstack_runtime_cloud: kolla-admin

openstack_runtime_external_host_interface: os-host
openstack_runtime_external_cidr: 192.168.250.0/24
openstack_runtime_aws_management_cidr: 172.31.16.0/20
openstack_runtime_tcp_ports:
  - 22
  - 53
  - 6443
openstack_runtime_udp_ports:
  - 53

# The edge-gateway uses the lab-host as a routed middlebox only for OpenStack
# floating-IP backends. Horizon is reached directly on the lab-host VPC IP.
openstack_runtime_edge_gateway_cidr: 172.31.31.71/32
openstack_runtime_edge_tcp_ports:
  - 443
  - 8080

# Horizon is published as HTTPS by the AWS ALB, while Kolla keeps its local
# Apache/Horizon listener on HTTP. These paths let the runtime role install a
# standard Kolla local_settings.d override and reconfigure only Horizon.
openstack_runtime_kolla_venv: /opt/kolla-venv
openstack_runtime_kolla_inventory: /data/openstack/kolla/inventory/all-in-one
openstack_runtime_kolla_config_dir: /etc/kolla
openstack_runtime_kolla_collections_path: /opt/kolla-venv/collections
openstack_runtime_horizon_public_fqdn: "cloud.{{ okd_base_domain }}"

# Persistent Spot lab-host recovery: ask Nova to restart guests that were
# running before the compute host was stopped/rebooted.
openstack_runtime_nova_compute_override_dir: "{{ openstack_runtime_kolla_config_dir }}/config/nova"
openstack_runtime_nova_compute_override_file: "{{ openstack_runtime_nova_compute_override_dir }}/nova-compute.conf"
