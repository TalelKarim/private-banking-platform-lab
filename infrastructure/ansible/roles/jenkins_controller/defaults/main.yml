---
jenkins_home: /var/lib/jenkins
jenkins_http_port: 8080
jenkins_admin_username: admin
jenkins_admin_password: null
jenkins_repository_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
jenkins_repository_url: https://pkg.jenkins.io/debian-stable
jenkins_repository_key_path: /etc/apt/keyrings/jenkins-keyring.asc
jenkins_java_package: openjdk-21-jre
jenkins_plugins:
  - workflow-aggregator
  - git
  - credentials-binding
  - ssh-agent
  - configuration-as-code
jenkins_cli_jar: /var/cache/jenkins/jenkins-cli.jar
jenkins_bootstrap_secret_dir: /run/jenkins-bootstrap
jenkins_admin_password_hash_file: "{{ jenkins_home }}/.ansible-admin-password.sha256"
