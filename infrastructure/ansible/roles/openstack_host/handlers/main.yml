---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart external network service
  ansible.builtin.systemd_service:
    name: private-banking-openstack-external-network.service
    enabled: true
    state: restarted
