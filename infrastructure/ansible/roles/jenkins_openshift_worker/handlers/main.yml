---
- name: Update trusted CA certificates
  ansible.builtin.command:
    argv:
      - /usr/sbin/update-ca-certificates
  changed_when: true

- name: Restart Jenkins agent for OpenShift toolchain environment
  ansible.builtin.systemd_service:
    name: "{{ jenkins_agent_service_name }}"
    state: restarted
    daemon_reload: true
