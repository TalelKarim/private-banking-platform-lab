---
- name: Create the Kolla virtual environment directory
  ansible.builtin.file:
    path: "{{ kolla_venv }}"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0755"

- name: Install the pinned Kolla-Ansible release and its Ansible runtime
  ansible.builtin.pip:
    name:
      - "kolla-ansible=={{ kolla_version }}"
      - "{{ kolla_ansible_core_spec }}"
    virtualenv: "{{ kolla_venv }}"
    virtualenv_command: python3 -m venv
    state: present
  become: true
  become_user: "{{ lab_user }}"

- name: Create Kolla configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0750"
  loop:
    - "{{ kolla_config_dir }}"
    - "{{ kolla_config_dir }}/globals.d"
    - /data/openstack/kolla/inventory
    - /data/openstack/secrets

- name: Create the dedicated Kolla Ansible collections directory
  ansible.builtin.file:
    path: "{{ kolla_collections_path }}"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0755"

- name: Install Kolla Ansible Galaxy dependencies
  ansible.builtin.command: "{{ kolla_venv }}/bin/kolla-ansible install-deps"
  become: true
  become_user: "{{ lab_user }}"
  environment:
    HOME: "/home/{{ lab_user }}"
    PATH: "{{ kolla_venv }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    ANSIBLE_COLLECTIONS_PATH: "{{ kolla_collections_path }}:/home/{{ lab_user }}/.ansible/collections:/usr/share/ansible/collections"
  changed_when: false

- name: Copy the official all-in-one inventory
  ansible.builtin.copy:
    src: "{{ kolla_venv }}/share/kolla-ansible/ansible/inventory/all-in-one"
    dest: "{{ kolla_inventory }}"
    remote_src: true
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0640"

- name: Render the main Kolla configuration
  ansible.builtin.template:
    src: globals.yml.j2
    dest: "{{ kolla_config_dir }}/globals.yml"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0640"

- name: Render modular Kolla configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ kolla_config_dir }}/globals.d/{{ item.dest }}"
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0640"
  loop:
    - src: globals.d/10-core.yml.j2
      dest: 10-core.yml
    - src: globals.d/20-storage.yml.j2
      dest: 20-storage.yml

- name: Initialise the persistent Kolla password file from the official example
  ansible.builtin.copy:
    src: "{{ kolla_venv }}/share/kolla-ansible/etc_examples/kolla/passwords.yml"
    dest: "{{ kolla_passwords_persistent }}"
    remote_src: true
    force: false
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0600"

- name: Remove the obsolete Kolla password generation marker
  ansible.builtin.file:
    path: /data/openstack/secrets/.passwords-generated
    state: absent

- name: Populate empty Kolla passwords in the persistent file
  ansible.builtin.command:
    argv:
      - "{{ kolla_venv }}/bin/kolla-genpwd"
      - --passwords
      - "{{ kolla_passwords_persistent }}"
  become: true
  become_user: "{{ lab_user }}"
  environment:
    HOME: "/home/{{ lab_user }}"
  changed_when: false
  no_log: true

- name: Verify that a core Kolla password was generated
  ansible.builtin.command:
    argv:
      - /usr/bin/grep
      - -Eq
      - '^keystone_admin_password:[[:space:]]+[^[:space:]]+'
      - "{{ kolla_passwords_persistent }}"
  changed_when: false
  no_log: true

- name: Link the persistent password file into /etc/kolla
  ansible.builtin.file:
    src: "{{ kolla_passwords_persistent }}"
    dest: "{{ kolla_config_dir }}/passwords.yml"
    state: link
    force: true
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"

- name: Create the dedicated OpenStack client virtual environment directory
  ansible.builtin.file:
    path: "{{ openstack_client_venv }}"
    state: directory
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0755"

- name: Create the dedicated OpenStack client virtual environment
  ansible.builtin.pip:
    name:
      - python-openstackclient
      - python-cinderclient
      - python-neutronclient
    virtualenv: "{{ openstack_client_venv }}"
    virtualenv_command: python3 -m venv
    extra_args: "-c https://releases.openstack.org/constraints/upper/{{ openstack_release }}"
    state: present
  become: true
  become_user: "{{ lab_user }}"

- name: Record the external network plan for the Terraform OpenStack layer
  ansible.builtin.copy:
    dest: /data/openstack/kolla/external-network.env
    owner: "{{ lab_user }}"
    group: "{{ lab_user }}"
    mode: "0640"
    content: |
      EXTERNAL_CIDR={{ openstack_external_cidr }}
      EXTERNAL_GATEWAY={{ openstack_external_gateway }}
      EXTERNAL_ALLOCATION_START={{ openstack_external_allocation_start }}
      EXTERNAL_ALLOCATION_END={{ openstack_external_allocation_end }}
      PHYSICAL_NETWORK=physnet1
