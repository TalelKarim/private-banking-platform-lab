---
- name: Reload SSH
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: reloaded

- name: Validate Nginx configuration
  ansible.builtin.command:
    argv: [/usr/sbin/nginx, -t]
  changed_when: false
  listen: Validate and reload Nginx

- name: Reload Nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Validate and reload Nginx
