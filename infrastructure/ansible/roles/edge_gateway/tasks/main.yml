---
- name: Validate edge gateway routes
  ansible.builtin.assert:
    that:
      - edge_nginx_routes | length > 0
      - item.name | length > 0
      - item.server_name | length > 0
      - >-
        (item.direct_response is defined and item.direct_response | int >= 400 and item.direct_response | int < 600)
        or
        (item.backend_scheme is defined and item.backend_scheme in ['http', 'https']
         and item.backend_host is defined and item.backend_host | length > 0
         and item.backend_port is defined and item.backend_port | int > 0
         and item.backend_port | int < 65536)
  loop: "{{ edge_nginx_routes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install EC2 Instance Connect support
  ansible.builtin.apt:
    name: "{{ edge_instance_connect_package }}"
    state: present
    update_cache: true
  notify: Reload SSH

- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ edge_nginx_package }}"
    state: present
    update_cache: true

- name: Render ALB-aware proxy header maps
  ansible.builtin.template:
    src: proxy-maps.conf.j2
    dest: "{{ edge_nginx_conf_d_dir }}/private-banking-proxy-maps.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload Nginx

- name: Remove the distribution default Nginx site
  ansible.builtin.file:
    path: "{{ edge_nginx_sites_enabled_dir }}/default"
    state: absent
  notify: Validate and reload Nginx

- name: Render managed edge virtual hosts
  ansible.builtin.template:
    src: route.conf.j2
    dest: "{{ edge_nginx_sites_available_dir }}/{{ edge_nginx_managed_prefix }}{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ edge_nginx_routes }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Validate and reload Nginx

- name: Enable managed edge virtual hosts
  ansible.builtin.file:
    src: "{{ edge_nginx_sites_available_dir }}/{{ edge_nginx_managed_prefix }}{{ item.name }}.conf"
    dest: "{{ edge_nginx_sites_enabled_dir }}/{{ edge_nginx_managed_prefix }}{{ item.name }}.conf"
    state: link
  loop: "{{ edge_nginx_routes }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Validate and reload Nginx

- name: Flush Nginx handlers before validation
  ansible.builtin.meta: flush_handlers

- name: Ensure Nginx is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ edge_nginx_service }}"
    enabled: true
    state: started

- name: Verify the local ALB health endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1/healthz
    status_code: 200
    return_content: true
  register: edge_healthcheck
  changed_when: false

- name: Assert the local ALB health endpoint payload
  ansible.builtin.assert:
    that:
      - edge_healthcheck.content | trim == 'ok'
