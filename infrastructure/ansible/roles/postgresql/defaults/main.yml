---
postgresql_major_version: 16
postgresql_cluster_name: main
postgresql_service_name: postgresql
postgresql_port: 5432
postgresql_private_ip: 10.10.0.40
postgresql_private_cidr: 10.10.0.0/24

postgresql_data_mount_point: /var/lib/postgresql
postgresql_data_directory: "/var/lib/postgresql/{{ postgresql_major_version }}/{{ postgresql_cluster_name }}"
postgresql_config_directory: "/etc/postgresql/{{ postgresql_major_version }}/{{ postgresql_cluster_name }}"
postgresql_log_directory: /var/log/postgresql

postgresql_packages:
  - "postgresql-{{ postgresql_major_version }}"
  - "postgresql-client-{{ postgresql_major_version }}"
  - postgresql-contrib
  - libpq-dev
  - python3-psycopg2

# Step 21 creates one real application database boundary without starting the
# application implementation phase. The NOLOGIN owner role separates object
# ownership from the LOGIN runtime identity. Step 45 can split runtime and
# migration privileges further when the platform hardening phase is reached.
postgresql_database_name: portfolio
postgresql_owner_role: portfolio_owner
postgresql_app_user: portfolio_app
postgresql_app_schema: portfolio
postgresql_app_password: null

postgresql_log_min_duration_statement_ms: 1000
