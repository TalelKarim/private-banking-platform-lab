spring:
  application:
    name: portfolio-java

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true

      group:
        liveness:
          include: livenessState

        readiness:
          include: readinessState,db

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-no-request-id}] %logger{36} - %msg%n"