apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portfolio-java.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "portfolio-java.name" . }}
    app.kubernetes.io/part-of: private-banking-platform-lab
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "portfolio-java.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "portfolio-java.name" . }}
        app.kubernetes.io/part-of: private-banking-platform-lab
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portfolio-java
          image: {{ required "image.ref must be set" .Values.image.ref | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "portfolio-java.name" . }}-config
            - secretRef:
                name: {{ .Values.secret.existingSecret }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
