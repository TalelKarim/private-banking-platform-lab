apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "risk-engine-api.name" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "risk-engine-api.name" . }}
    app.kubernetes.io/part-of: private-banking-platform-lab
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.config.environment | quote }}
  ASPNETCORE_HTTP_PORTS: {{ .Values.config.httpPorts | quote }}
  PortfolioApi__BaseUrl: {{ .Values.config.portfolioApiBaseUrl | quote }}
  PortfolioApi__TimeoutSeconds: {{ .Values.config.portfolioApiTimeoutSeconds | quote }}
