apiVersion: v1
kind: Service
metadata:
  name: {{ include "risk-engine-api.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "risk-engine-api.name" . }}
    app.kubernetes.io/part-of: private-banking-platform-lab
spec:
  selector:
    app.kubernetes.io/name: {{ include "risk-engine-api.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
