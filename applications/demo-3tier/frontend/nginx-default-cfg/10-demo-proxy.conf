# This snippet is inserted inside the image's default server block.
# The browser sees one public hostname; /api stays same-origin and Nginx
# forwards it to the backend Kubernetes Service using cluster DNS.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location /api/ {
    proxy_pass http://demo-backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
