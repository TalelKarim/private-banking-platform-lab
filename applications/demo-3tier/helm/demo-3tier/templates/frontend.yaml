apiVersion: v1
kind: Service
metadata:
  name: demo-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo3tier.frontendLabels" . | nindent 4 }}
spec:
  selector:
    app: demo-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo3tier.frontendLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: demo-frontend
  template:
    metadata:
      labels:
        {{- include "demo3tier.frontendLabels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ required "frontend.image.ref is required; Jenkins must pass an immutable digest image reference" .Values.frontend.image.ref | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
