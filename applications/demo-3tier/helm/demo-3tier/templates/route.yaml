{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.route.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo3tier.frontendLabels" . | nindent 4 }}
spec:
  host: {{ required "route.host is required; Jenkins must pass the public demo hostname" .Values.route.host | quote }}
  to:
    kind: Service
    name: demo-frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
  wildcardPolicy: None
{{- end }}
