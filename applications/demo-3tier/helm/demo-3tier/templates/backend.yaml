apiVersion: v1
kind: Service
metadata:
  name: demo-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo3tier.backendLabels" . | nindent 4 }}
spec:
  selector:
    app: demo-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo3tier.backendLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: demo-backend
  template:
    metadata:
      labels:
        {{- include "demo3tier.backendLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: {{ required "backend.image.ref is required; Jenkins must pass an immutable digest image reference" .Values.backend.image.ref | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: demo-backend-config
            - secretRef:
                name: {{ required "postgres.existingSecret is required" .Values.postgres.existingSecret | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
