apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: cicd
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: ci-cd
    app.kubernetes.io/part-of: private-banking-platform-lab
automountServiceAccountToken: false
---
# Lab-specific external Jenkins credential. Kubernetes recommends TokenRequest
# for short-lived credentials; this deliberately creates a stable token because
# Jenkins lives outside the cluster and configure-lab rotates/reinjects it on
# every daily cluster rebuild. The token is never committed to Git.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-api-token
  namespace: cicd
  annotations:
    kubernetes.io/service-account.name: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: ci-cd
type: kubernetes.io/service-account-token
