apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: private-banking-jenkins-deployer
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: ci-cd
    app.kubernetes.io/part-of: private-banking-platform-lab
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - replicasets
      - statefulsets
      - statefulsets/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes", "routes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: private-banking-jenkins-deployer
---
# OpenShift's integrated registry authorizes pushes per namespace/project. This
# binding grants only image-push rights in demo; it does not make Jenkins a
# cluster administrator.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-image-builder
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
---
# Ensure Pods in demo can pull images that Jenkins pushes to the same project,
# even though the namespace is created directly by platform automation rather
# than through an interactive OpenShift ProjectRequest.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: private-banking-image-pullers
  namespace: demo
subjects:
  - kind: Group
    name: system:serviceaccounts:demo
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
