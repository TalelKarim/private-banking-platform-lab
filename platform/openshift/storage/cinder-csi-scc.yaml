apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: private-banking-cinder-csi-privileged-scc
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - privileged
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: private-banking-cinder-csi-privileged-scc
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: private-banking-cinder-csi-privileged-scc
subjects:
  - kind: ServiceAccount
    name: csi-cinder-node-sa
    namespace: kube-system
