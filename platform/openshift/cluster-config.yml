---
# Single source of truth for the user-provisioned compact OKD cluster.
# Terraform owns the OpenStack infrastructure; Ansible and the future
# openshift-install orchestration consume these stable logical values.
okd_cluster_name: okd
# Public Route53 zone already owned by the user; Terraform only looks it up.
lab_public_dns_zone: talelkarimchebbi.com
# Use a real delegated DNS suffix for the cluster so console/OAuth/future Routes
# can be published cleanly through the AWS public ingress.
okd_base_domain: lab.talelkarimchebbi.com

# Pin one stable OKD release so every daily rebuild uses the same installer,
# client tools and matching CentOS Stream CoreOS boot image.
okd_release_version: 4.22.0-okd-scos.8
okd_architecture: x86_64

okd_machine_network_cidr: 10.20.0.0/24
okd_pod_network_cidr: 10.128.0.0/14
okd_pod_host_prefix: 23
okd_service_network_cidr: 172.30.0.0/16

okd_lb_ip: 10.20.0.10
okd_ignition_http_port: 8080

# Stable OpenStack foundation object names consumed by the runtime-node layer.
# The durable foundation is still owned by the HCP Terraform workspace; the
# short-lived bootstrap/control-plane layer only looks these objects up by name.
okd_openstack_network_name: openshift-net
okd_openstack_subnet_name: openshift-subnet
okd_openstack_flavor_name: okd.control
okd_openstack_security_group_name: openshift-nodes
okd_openstack_keypair_name: private-banking-lab-workloads

okd_bootstrap:
  name: bootstrap
  ip: 10.20.0.11

okd_control_planes:
  - name: okd-01
    ip: 10.20.0.21
  - name: okd-02
    ip: 10.20.0.22
  - name: okd-03
    ip: 10.20.0.23

# Reusable OpenShift storage/registry foundation. The cluster is installed as
# platform:none, so the OpenStack-specific CSI integration is converged after
# installation instead of being auto-installed by the OpenShift installer.
okd_helm_version: 3.20.1
okd_cinder_csi_chart_version: 2.35.0
okd_cinder_storage_class: cinder-standard
okd_cinder_openstack_project: admin
okd_cinder_openstack_user: okd-cinder-csi
okd_cinder_openstack_role: member
okd_openstack_region: RegionOne
okd_cinder_password_ssm_parameter: /private-banking-platform-lab/openshift/cinder-csi-password

# Lab-sized registry storage. Cinder is block/RWO, therefore the integrated
# registry is intentionally single-replica with Recreate rollout strategy.
okd_registry_storage_size: 20Gi
